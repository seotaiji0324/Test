<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울특별시 동작구 사당동 중고거래</title><style>:root{--orange:#ff6f0f;--text:#212124;--muted:#868b94;--line:#eaebee}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:var(--text)}button,input{font:inherit}header{border-bottom:1px solid #f5f5f5;background:#fff;position:sticky;top:0;z-index:5}.top{height:64px;display:flex;align-items:center;gap:14px;max-width:1450px;margin:auto;padding:0 22px}.logo{font-size:26px;font-weight:900;color:var(--orange)}.mode{font-weight:700}.search{height:44px;flex:1;max-width:430px;border:1px solid var(--line);border-radius:24px;padding:0 18px}.nav{display:flex;gap:8px;margin-left:auto}.nav button{border:1px solid #f1f2f4;background:#fff;border-radius:22px;padding:11px 16px;font-weight:700}.keywords{max-width:1450px;margin:auto;padding:0 22px 12px;display:flex;gap:16px;overflow:hidden;color:#73777f;font-size:14px;white-space:nowrap}.keywords b{color:#536274}.keyword{cursor:pointer;border:0;background:none;padding:0;color:#73777f}.keyword:hover,.keyword.active{color:var(--orange);text-decoration:underline}main{max-width:1450px;margin:42px auto;padding:0 22px}h1{font-size:30px;margin:0 0 48px}.layout{display:grid;grid-template-columns:270px 1fr;gap:30px}.filters{padding-right:28px}.filter-title{font-size:22px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:30px}.reset{font-size:14px;color:#8c9199;text-decoration:underline;font-weight:400;cursor:pointer}.section{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}.section h3{font-size:17px}.select{border:1px solid var(--line);border-radius:9px;padding:13px 15px}.locate{margin-top:9px;border:0;border-radius:8px;background:#34373d;color:#fff;padding:13px 18px;font-weight:700}.check,.cat{display:flex;align-items:center;gap:10px}.box{width:26px;height:26px;border:1px solid #e1e3e7;border-radius:6px}.cats{display:flex;flex-direction:column;gap:17px}.cat{cursor:pointer;user-select:none}.radio{width:27px;height:27px;border:1px solid #e1e3e7;border-radius:50%;position:relative;flex:0 0 auto}.cat.active{font-weight:700}.cat.active .radio{border-color:var(--orange)}.cat.active .radio:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--orange)}.count{margin-left:auto;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:70px 18px}.photo{width:100%;aspect-ratio:1;border-radius:7px;object-fit:cover}.name{font-size:17px;margin:11px 0 4px}.price{font-size:18px;font-weight:800}.meta{font-size:13px;color:#9aa0a6;margin-top:10px}.empty{grid-column:1/-1;text-align:center;padding:70px;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.mode,.nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}}</style></head><body><header><div class="top"><div class="logo">📍 당근</div><div class="mode">👜 중고거래⌄</div><input class="search" placeholder="검색어를 입력해주세요"><div class="nav"><button>중고거래</button><button>동네업체</button><button>중고차</button></div></div><div class="keywords"><b>추천 검색어</b><button class="keyword">원서</button><button class="keyword">크림</button><button class="keyword">샤넬</button><button class="keyword">바구니</button><button class="keyword">원피스</button><button class="keyword">수영복</button></div></header><main><h1>서울특별시 동작구 사당동 중고거래</h1><div class="layout"><aside class="filters"><div class="filter-title">필터 <span class="reset">초기화</span></div><div class="section"><h3>위치</h3><div class="select">서울시 동작구 사당동</div><button class="locate">◉ 현 위치로 설정</button></div><div class="section"><h3>상태</h3><div class="check"><span class="box"></span>거래 가능한 보기</div></div><div class="section"><h3>카테고리</h3><div class="cats" id="cats"></div></div></aside><section class="grid" id="grid"></section></div></main><script>
const items=[['item1.jpg','매직스쿨버스 원서 + cd','15,000원','사당동 · 끌올 20분 전','유아도서'],['item2.jpg','이즈앤트리 어니언 뉴페어 겔크림 50...','15,000원','사당동 · 끌올 20분 전','생활/주방'],['item3.jpg','(미사용) 샤넬 레 베쥬 골든 글로우 파우더','35,000원','사당동 · 21분 전','생활/주방'],['item4.jpg','체크무늬 손잡이 바구니','2,000원','사당동 · 끌올 25분 전','가구/인테리어'],['item5.jpg','차콜 스트링 조절 원피스','12,000원','사당동 · 28분 전','여성의류'],['item6.jpg','레오파드 플리츠 롱 원피스(1회실착)','18,000원','사당동 · 31분 전','여성의류'],['item7.jpg','유니클로 플로럴 원피스 L','10,000원','사당동 · 35분 전','여성의류'],['item8.jpg','폴 프랭크 수영복 (새상품)','8,000원','사당동 · 40분 전','유아동']];
const categories=['전체','디지털기기','생활가전','가구/인테리어','생활/주방','유아동','유아도서','여성의류'];const grid=document.querySelector('#grid'),search=document.querySelector('.search'),catsEl=document.querySelector('#cats'),keywordEls=[...document.querySelectorAll('.keyword')];let selectedCategory='전체';function countCategory(cat){return cat==='전체'?items.length:items.filter(x=>x[4]===cat).length}function renderCategories(){catsEl.innerHTML='';categories.forEach(cat=>{const el=document.createElement('div');el.className='cat'+(selectedCategory===cat?' active':'');el.dataset.category=cat;el.innerHTML=`<span class="radio"></span><span>${cat}</span><span class="count">${countCategory(cat)}</span>`;el.onclick=()=>{selectedCategory=cat;renderCategories();renderItems()};catsEl.appendChild(el)})}function syncKeywords(){const q=search.value.trim();keywordEls.forEach(x=>x.classList.toggle('active',x.textContent.trim()===q))}function renderItems(){const q=search.value.trim().toLowerCase();const filtered=items.filter(x=>(selectedCategory==='전체'||x[4]===selectedCategory)&&(!q||x[1].toLowerCase().includes(q)));grid.innerHTML='';if(!filtered.length){grid.innerHTML=`<div class="empty">검색 조건에 맞는 상품이 없습니다.</div>`;return}filtered.forEach(x=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<img class="photo" src="./carrot_page/assets/${x[0]}" alt="${x[1]}"><div class="name">${x[1]}</div><div class="price">${x[2]}</div><div class="meta">${x[3]}</div>`;grid.appendChild(el)})}keywordEls.forEach(el=>el.onclick=()=>{const word=el.textContent.trim();search.value=search.value.trim()===word?'':word;syncKeywords();renderItems();search.focus()});search.oninput=()=>{syncKeywords();renderItems()};document.querySelector('.reset').onclick=()=>{selectedCategory='전체';search.value='';syncKeywords();renderCategories();renderItems()};document.querySelector('.locate').onclick=()=>alert('현재 위치 설정 기능 예시입니다.');document.querySelector('.box').onclick=function(){this.style.background=this.style.background?'':'#ff6f0f'};renderCategories();renderItems();
</script></body></html>
