<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서울특별시 동작구 사당동 중고거래</title>
<style>
:root{--orange:#ff6f0f;--text:#212124;--muted:#868b94;--line:#eaebee;--chip:#f2f3f6}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:var(--text);background:#fff}button,input{font:inherit}
header{border-bottom:1px solid #f5f5f5;background:#fff;position:sticky;top:0;z-index:5}.top{height:64px;display:flex;align-items:center;gap:14px;max-width:1450px;margin:auto;padding:0 22px}.logo{font-size:26px;font-weight:900;color:var(--orange);display:flex;align-items:center;gap:7px}.pin{width:19px;height:19px;border-radius:50% 50% 50% 0;background:var(--orange);transform:rotate(-45deg);position:relative}.pin:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:white;left:6px;top:6px}.mode{font-weight:700}.search{height:44px;flex:1;max-width:430px;border:1px solid var(--line);border-radius:24px;padding:0 18px;font-size:16px}.nav{display:flex;gap:8px;margin-left:auto}.nav button{border:1px solid #f1f2f4;background:#fff;border-radius:22px;padding:11px 16px;font-weight:700;white-space:nowrap}.keywords{max-width:1450px;margin:auto;padding:0 22px 12px;display:flex;gap:16px;overflow:hidden;color:#73777f;font-size:14px;white-space:nowrap}.keywords b{color:#536274}
main{max-width:1450px;margin:42px auto;padding:0 22px}h1{font-size:30px;margin:0 0 48px;font-weight:800}.layout{display:grid;grid-template-columns:270px 1fr;gap:30px}.filters{padding-right:28px}.filter-title{font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.reset{font-size:14px;color:#8c9199;text-decoration:underline;font-weight:400}.section{padding:0 0 28px;border-bottom:1px solid var(--line);margin-bottom:28px}.section h3{font-size:17px;margin:0 0 18px}.select{border:1px solid var(--line);border-radius:9px;padding:13px 15px;display:flex;justify-content:space-between;font-weight:700}.locate{margin-top:9px;border:0;border-radius:8px;background:#34373d;color:#fff;padding:13px 18px;font-weight:700}.check{display:flex;align-items:center;gap:10px}.box{width:26px;height:26px;border:1px solid #e1e3e7;border-radius:6px}.cats{display:flex;flex-direction:column;gap:17px}.cat{display:flex;align-items:center;gap:11px}.radio{width:27px;height:27px;border:1px solid #e1e3e7;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:70px 18px}.card{min-width:0;cursor:pointer}.photo{width:100%;aspect-ratio:1/1;border-radius:7px;object-fit:cover;display:block}.name{font-size:17px;margin:11px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:18px;font-weight:800}.meta{font-size:13px;color:#9aa0a6;margin-top:10px}.card:hover .name{text-decoration:underline}.badge{display:inline-block;background:#fff3e8;color:var(--orange);border-radius:5px;padding:3px 6px;font-size:11px;margin-left:6px}
@media(max-width:1000px){.nav button:nth-child(n+4){display:none}.layout{grid-template-columns:1fr}.filters{display:none}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.mode,.nav{display:none}.top{gap:8px}.logo{font-size:22px}.grid{grid-template-columns:repeat(2,1fr);gap:36px 12px}main{margin-top:25px}h1{font-size:23px;margin-bottom:28px}.keywords{display:none}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo"><span class="pin"></span>당근</div><div class="mode">👜 중고거래⌄</div><input class="search" placeholder="검색어를 입력해주세요"/><div class="nav"><button>👜 중고거래</button><button>🧰 동네업체</button><button>🚙 중고차⌄</button><button>▣ 동네생활</button><button>👥 모임</button><button>🔎 알바⌄</button><button>🏠 부동산 ↗</button><button>•••</button></div></div>
  <div class="keywords"><b>추천 검색어</b><span>자전거</span><span>픽시</span><span>컴퓨터</span><span>폴드8</span><span>냉장고</span><span>에어팟</span><span>모니터</span><span>노트북</span><span>포켓몬카드</span><span>닌텐도</span><span>갤럭시</span><span>핸드폰</span><span>아이패드</span><span>세탁기</span><span>에어컨</span><span>의자</span></div>
</header>
<main>
<h1>서울특별시 동작구 사당동 중고거래</h1>
<div class="layout">
<aside class="filters">
  <div class="filter-title">필터 <span class="reset">초기화</span></div>
  <div class="section"><h3>위치</h3><div class="select">서울시 동작구 사당동 <span>⌄</span></div><button class="locate">◉ 현 위치로 설정</button></div>
  <div class="section"><h3>상태</h3><div class="check"><span class="box"></span> 거래 가능한 보기</div></div>
  <div class="section"><h3>카테고리</h3><div class="cats"><div class="cat"><span class="radio"></span>디지털기기</div><div class="cat"><span class="radio"></span>생활가전</div><div class="cat"><span class="radio"></span>가구/인테리어</div><div class="cat"><span class="radio"></span>생활/주방</div><div class="cat"><span class="radio"></span>유아동</div><div class="cat"><span class="radio"></span>유아도서</div><div class="cat"><span class="radio"></span>여성의류</div></div></div>
</aside>
<section class="grid" id="grid"></section>
</div>
</main>
<script>
const items=[
['./item1.jpg','매직스쿨버스 원서 + cd','15,000원','사당동 · 끌올 20분 전'],
['item2.jpg','이즈앤트리 어니언 뉴페어 겔크림 50...','15,000원','사당동 · 끌올 20분 전'],
['item3.jpg','(미사용) 샤넬 레 베쥬 골든 글로우 파우더','35,000원','사당동 · 21분 전'],
['item4.jpg','체크무늬 손잡이 바구니','2,000원','사당동 · 끌올 25분 전'],
['item5.jpg','차콜 스트링 조절 원피스','12,000원','사당동 · 28분 전'],
['item6.jpg','레오파드 플리츠 롱 원피스(1회실착)','18,000원','사당동 · 31분 전'],
['item7.jpg','유니클로 플로럴 원피스 L','10,000원','사당동 · 35분 전'],
['item8.jpg','폴 프랭크 수영복 (새상품)','8,000원','사당동 · 40분 전']];
const grid=document.querySelector('#grid');
items.forEach((x,i)=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<img class="photo" src="assets/${x[0]}" alt="${x[1]}"><div class="name">${x[1]}</div><div class="price">${x[2]}</div><div class="meta">${x[3]}</div>`;grid.appendChild(el)});
document.querySelector('.reset').onclick=()=>alert('필터가 초기화되었습니다.');
document.querySelector('.locate').onclick=()=>alert('현재 위치 설정 기능 예시입니다.');
document.querySelectorAll('.box,.radio').forEach(x=>x.onclick=()=>{x.style.background=x.style.background?'':'#ff6f0f'});
</script>
</body></html>
